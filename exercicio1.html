<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Formulário de Registros de Usuário</h1>
    </header>
    <main>
        <form action="#" method="POST">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome..." required>
            <br>
            <br>

            <label for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome..." required>
            <br>
            <br>

            <label for="dataNascimento">Data de Nascimento</label>
            <input type="date" id="dataNascimento" name="dataNascimento" required>
            <br>
            <br>

            <label>Gênero:</label>
            <br>
            <label for="feminino">Feminino</label>
            <input type="radio" id="feminino" name="genero" required>
            <br>
            <label for="masculino">Masculino</label>
            <input type="radio" id="masculino" name="genero" required>
            
            <br>
            <br>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email..." required>
            <br>
            <br>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone..." required>
            <br>
            <br>

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço...">
            <br>
            <br>

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade..." required>
            <br>
            <br>

            <label for="estado">Estado</label>
            <select name="opcao" id="opcao">
                <option value="" selected disabled>Selecione...</option>
                <option value="Amazonas">Amazonas (AM)</option>
                <option value="Para">Pará (PA)</option>
                <option value="Bahia">Bahia (BA)</option>
                <option value="Goias">Goiás (GO)</option>
                <option value="Rio de Janeiro">Rio de Janeiro (RJ)</option>
            </select>
            <br>
            <br>

            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep" placeholder="Digite o CEP..." required>
            <br>
            <br>

            <label for="usuario">Nome de Usuário</label>
            <input type="text" id="usuario" name="usuario" placeholder="Digite o nome do usuário..." required>
            <br>
            <br>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>
            <br>
            <br>

            <label for="confirma_senha">Confirmar senha</label>
            <input type="password" id="confirma_senha" name="confirma_senha" required>
            <br>
            <br>

            <label for="foto">Foto de Perfil</label>
            <input type="file" id="foto" name="foto">
            <br>
            <br>

            <label for="hobbies">Hobbies</label>
            <br>
            <input type="checkbox" id="caminhar" name="caminhar" required>
            <label for="caminhar">Caminhar</label>
            <br>
            <input type="checkbox" id="jogar" name="jogar" required>
            <label for="jogar">Jogar</label>
            <br>
            <input type="checkbox" id="ler" name="ler" required>
            <label for="ler">Ler</label>
            <br>
            <br>
            
            <label for="nivel_educação">Nível de Educação</label>
            <select name="nivel_educação" id="nivel_educação">
                <option value="" selected disabled>Selecionar...</option>
                <option value="fund1">Fundamental I</option>
                <option value="fund2">Fundamental II</option>
                <option value="ensino_medio">Ensino Médio</option>
                <option value="superior">Ensino superior</option>
            </select>
            <br>
            <br>
            <label for="profissao">Profissão</label>
            <input type="text" id="profissao" name="profissao" placeholder="Digite sua profissão...">
            <br>
            <br>
            <label for="biografia">Biografia</label>
            <br>
            <textarea name="biografia" id="biografia" rows="8" cols="50" placeholder="Digite a biografia..."></textarea>
            <br>
            <br>
            <input type="checkbox" name="termo" id="termo" required>
            <label for="termo">Termos e Condições</label>
            <input type="checkbox" id="notificacao" name="notificacao">
            <label for="notificacao">Receber Notificação</label>
            <br>
            <br>
            <button type="submit">ENVIAR</button>
        </form>
    </main>
</body>
</html>
